<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900">
    <stop stop-color="#020617"/>
    <stop offset="0.5" stop-color="#07133A"/>
    <stop offset="1" stop-color="#160B3D"/>
  </linearGradient>
  <linearGradient id="bluePurple" x1="300" y1="300" x2="1300" y2="650">
    <stop stop-color="#1769FF"/>
    <stop offset="1" stop-color="#7C2DFF"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#FFFFFF" stop-opacity=".14"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity=".03"/>
  </linearGradient>
  <radialGradient id="glowBlue">
    <stop stop-color="#1769FF" stop-opacity=".55"/>
    <stop offset="1" stop-color="#1769FF" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowPurple">
    <stop stop-color="#7C2DFF" stop-opacity=".5"/>
    <stop offset="1" stop-color="#7C2DFF" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="55"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000" flood-opacity=".45"/>
  </filter>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>

<circle cx="330" cy="250" r="260" fill="url(#glowBlue)" filter="url(#blur)"/>
<circle cx="1320" cy="650" r="280" fill="url(#glowPurple)" filter="url(#blur)"/>

<g opacity=".16">
  <path d="M0 160H1600M0 320H1600M0 480H1600M0 640H1600M0 800H1600" stroke="#8EA7FF"/>
  <path d="M160 0V900M320 0V900M480 0V900M640 0V900M800 0V900M960 0V900M1120 0V900M1280 0V900M1440 0V900" stroke="#8EA7FF"/>
</g>

<!-- floating orbit -->
<ellipse cx="800" cy="470" rx="600" ry="270" stroke="url(#bluePurple)" stroke-opacity=".28" stroke-width="2" transform="rotate(-12 800 470)"/>
<ellipse cx="800" cy="470" rx="520" ry="210" stroke="#4D7CFF" stroke-opacity=".16" stroke-width="1" transform="rotate(18 800 470)"/>

<!-- left floating glass card -->
<g filter="url(#shadow)" transform="rotate(-8 300 500)">
  <rect x="120" y="390" width="360" height="220" rx="28" fill="url(#glass)" stroke="#6C8DFF" stroke-opacity=".3"/>
  <text x="160" y="440" fill="#A9B9E8" font-family="Arial" font-size="20">TODAY'S EARNINGS</text>
  <text x="160" y="505" fill="white" font-family="Arial" font-size="46" font-weight="700">KES 1,240</text>
  <path d="M160 560 C210 540 245 555 285 520 C325 485 355 525 400 470" stroke="url(#bluePurple)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="400" cy="470" r="9" fill="#7C2DFF"/>
</g>

<!-- right floating glass card -->
<g filter="url(#shadow)" transform="rotate(8 1300 500)">
  <rect x="1120" y="390" width="360" height="220" rx="28" fill="url(#glass)" stroke="#8B5CFF" stroke-opacity=".32"/>
  <text x="1160" y="440" fill="#B8B0E8" font-family="Arial" font-size="20">WALLET BALANCE</text>
  <text x="1160" y="505" fill="white" font-family="Arial" font-size="42" font-weight="700">KES 8,450</text>
  <rect x="1160" y="545" width="280" height="10" rx="5" fill="#172554"/>
  <rect x="1160" y="545" width="205" height="10" rx="5" fill="url(#bluePurple)"/>
</g>

<!-- central 3D-ish wallet -->
<g filter="url(#shadow)">
  <rect x="500" y="255" width="600" height="390" rx="46" fill="#07112F" stroke="url(#bluePurple)" stroke-width="3"/>
  <rect x="530" y="285" width="540" height="330" rx="34" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity=".08"/>

  <circle cx="800" cy="390" r="82" fill="url(#bluePurple)" opacity=".2" filter="url(#soft)"/>
  
  <!-- VXM mark -->
  <path d="M665 365L710 445L758 365L800 430L850 350L925 365L865 445L800 445L755 405L720 445L665 365Z" fill="url(#bluePurple)"/>
  <path d="M730 460L890 320" stroke="#4D7CFF" stroke-width="18" stroke-linecap="round"/>
  <path d="M875 320L890 320L888 338" stroke="#4D7CFF" stroke-width="8" stroke-linecap="round"/>

  <text x="800" y="530" text-anchor="middle" fill="white" font-family="Arial" font-size="54" font-weight="800" letter-spacing="10">VXM</text>
  <text x="800" y="570" text-anchor="middle" fill="#9FB0DD" font-family="Arial" font-size="18" letter-spacing="5">DIGITAL EARNING PLATFORM</text>
</g>

<!-- floating coins -->
<g filter="url(#shadow)">
  <ellipse cx="420" cy="245" rx="72" ry="22" fill="#1769FF" opacity=".75"/>
  <rect x="348" y="220" width="144" height="25" rx="12" fill="#2F7BFF"/>
  <ellipse cx="420" cy="220" rx="72" ry="22" fill="#63A0FF"/>
  <text x="420" y="228" text-anchor="middle" fill="white" font-family="Arial" font-size="18" font-weight="700">VXM</text>

  <ellipse cx="1190" cy="700" rx="65" ry="20" fill="#7C2DFF" opacity=".75"/>
  <rect x="1125" y="677" width="130" height="23" rx="11" fill="#7C2DFF"/>
  <ellipse cx="1190" cy="677" rx="65" ry="20" fill="#A879FF"/>
  <text x="1190" y="684" text-anchor="middle" fill="white" font-family="Arial" font-size="16" font-weight="700">VXM</text>
</g>

<!-- particles -->
<g fill="#8EA7FF">
  <circle cx="180" cy="180" r="4"/>
  <circle cx="260" cy="710" r="3"/>
  <circle cx="520" cy="150" r="4"/>
  <circle cx="1080" cy="160" r="3"/>
  <circle cx="1390" cy="280" r="4"/>
  <circle cx="1450" cy="730" r="3"/>
  <circle cx="1010" cy="760" r="4"/>
</g>

<text x="800" y="105" text-anchor="middle" fill="white" font-family="Arial" font-size="24" letter-spacing="9" opacity=".7">TURN YOUR TIME INTO EARNINGS</text>
<text x="800" y="820" text-anchor="middle" fill="#8194C7" font-family="Arial" font-size="17" letter-spacing="4">TASKS  •  WALLET  •  REFERRALS  •  M-PESA  •  ADMIN</text>
</svg>
