<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#030712" />
  <title>Create Account | VXM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="assets/css/vxm.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a href="index.html" class="logo">
        <img src="images/logo.jpg" alt="VXM" onerror="this.style.display='none'" />
        <span>VXM</span>
      </a>
      <h1>Create your account</h1>
      <p class="subtitle">Join VXM and start your earning journey.</p>
      <form action="register.php" method="post" id="registerForm">
        <div class="form-group">
          <label class="form-label" for="name">Full name</label>
          <input class="form-control" type="text" id="name" name="full_name" required autocomplete="name" placeholder="Your full name" />
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-control" type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label class="form-label" for="phone">Phone (M-Pesa)</label>
          <input class="form-control" type="tel" id="phone" name="phone" required autocomplete="tel" placeholder="07XXXXXXXX" />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" type="password" id="password" name="password" required autocomplete="new-password" minlength="8" placeholder="At least 8 characters" />
        </div>
        <div class="form-group">
          <label class="form-label" for="password_confirm">Confirm password</label>
          <input class="form-control" type="password" id="password_confirm" name="confirm_password" required autocomplete="new-password" placeholder="Repeat password" />
        </div>
        <div class="form-group">
          <label class="form-label" for="referral">Referral code (optional)</label>
          <input class="form-control" type="text" id="referral" name="referral_code" placeholder="If you have one" />
        </div>
        <div class="form-group">
          <label class="flex items-center gap-1" style="color:var(--text-secondary);font-size:0.875rem;cursor:pointer;">
            <input type="checkbox" name="terms" value="1" required style="accent-color:var(--accent);" />
            I agree to the <a href="terms.html" class="text-accent" target="_blank">Terms</a> and <a href="privacy.html" class="text-accent" target="_blank">Privacy Policy</a>
          </label>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Create account</button>
      </form>
      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>
  </div>
</body>
</html>
