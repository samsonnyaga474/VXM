<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#030712" />
  <title>Forgot Password | VXM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="assets/css/vxm.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a href="index.html" class="logo">
        <img src="images/logo.jpg" alt="VXM" onerror="this.style.display='none'" />
        <span>VXM</span>
      </a>
      <h1>Reset password</h1>
      <p class="subtitle">Enter your email and we'll send a reset link if an account exists.</p>
      <form action="forgot-password.php" method="post">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-control" type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com" />
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Send reset link</button>
      </form>
      <div class="auth-footer">
        <a href="login.html">Back to login</a>
      </div>
    </div>
  </div>
</body>
</html>
