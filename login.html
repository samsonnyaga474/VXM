<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#030712" />
  <title>Login | VXM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="assets/css/vxm.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a href="index.html" class="logo">
        <img src="images/logo.jpg" alt="VXM" onerror="this.style.display='none'" />
        <span>VXM</span>
      </a>
      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to your VXM account to continue.</p>
      <form action="login.php" method="post" id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-control" type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" type="password" id="password" name="password" required autocomplete="current-password" placeholder="Your password" />
        </div>
        <div class="flex justify-between items-center mb-3" style="font-size:0.875rem;">
          <label class="flex items-center gap-1" style="color:var(--text-secondary);cursor:pointer;">
            <input type="checkbox" name="remember" value="1" style="accent-color:var(--accent);" /> Remember me
          </label>
          <a href="forgot-password.html" class="text-accent">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Sign in</button>
      </form>
      <div class="auth-footer">
        Don't have an account? <a href="register.html">Create one</a>
      </div>
    </div>
  </div>
</body>
</html>
